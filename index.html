<title>Pocket Loop Lab</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=IBM+Plex+Sans:wght@400;600&display=swap">
<style>
  /* Layout: full-bleed 3D stage; HUD floats in the safe area; menu is a left-aligned stack of numbered cabinets. */
  :root {
    color-scheme: dark;
    --bg: #070a18;
    /* HUD design tokens. A game's theme (kit/theme.js) overrides these on <body> while it runs. */
    --ink: #eef2ff;
    --dim: #9aa6cf;
    --panel: rgba(13, 18, 40, 0.78);
    --line: rgba(160, 180, 255, 0.22);
    --accent: #ffc145;
    --accent-ink: #1a1205;
    --accent-edge: #b27d10;
    --gold: var(--accent); /* legacy alias */
    --hot: #ff5d73;
    --scrim: rgba(4, 6, 16, 0.62);
    --radius: 10px;
    --radius-lg: 14px;
    --border: 1px;
    --shadow: none;
    --blur: 6px;
    --label-case: uppercase;
    --label-spacing: 0.1em;
    --stat-size: 18px;
    --floater: #ffc145;
    --display: "Chakra Petch", "Trebuchet MS", system-ui, sans-serif;
    --body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px;
    overflow: hidden; overscroll-behavior: none; -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; touch-action: manipulation; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  #stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #flash { position: fixed; inset: 0; pointer-events: none; opacity: 0; }
  #floaters { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
  .floater {
    position: absolute; transform: translate(-50%, -50%); font: 700 20px var(--display); color: var(--floater);
    text-shadow: 0 2px 0 rgba(0,0,0,.55); white-space: nowrap; animation: rise .85s ease-out forwards;
  }
  @keyframes rise { 0% { opacity: 0; transform: translate(-50%, -20%) scale(.6); } 18% { opacity: 1; transform: translate(-50%, -70%) scale(1.15); } 100% { opacity: 0; transform: translate(-50%, -260%) scale(1); } }

  .safe {
    position: fixed; inset: 0; display: flex; flex-direction: column; pointer-events: none;
    padding-block: calc(env(safe-area-inset-top, 0px) + 10px) calc(env(safe-area-inset-bottom, 0px) + 12px);
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  /* HUD */
  #hud-top { display: flex; align-items: flex-start; gap: 8px; }
  .chip {
    pointer-events: auto; background: var(--panel); border: var(--border) solid var(--line); border-radius: var(--radius);
    height: 38px; min-width: 38px; padding: 0 10px; font: 700 14px var(--display); backdrop-filter: blur(var(--blur));
   box-shadow: var(--shadow);
  }
  #game-name { font: 700 12px var(--display); letter-spacing: .12em; text-transform: uppercase; color: var(--dim); align-self: center; }
  @media (max-width: 560px) { #game-name { display: none; } }
  #stats { margin-left: auto; display: flex; flex-wrap: nowrap; justify-content: flex-end; gap: 6px; min-width: 0; }
  .stat {
    background: var(--panel); border: var(--border) solid var(--line); border-radius: var(--radius); padding: 4px 9px; min-width: 52px; white-space: nowrap;
    display: flex; flex-direction: column; line-height: 1.1; backdrop-filter: blur(var(--blur));
   box-shadow: var(--shadow);
  }
  .stat span { font-size: 10px; letter-spacing: var(--label-spacing); text-transform: var(--label-case); color: var(--dim); }
  .stat b { font: 700 var(--stat-size) var(--display); font-variant-numeric: tabular-nums; }
  .stat.pulse { animation: pulse .28s ease-out; }
  @keyframes pulse { 40% { transform: scale(1.14); border-color: var(--accent); } }
  /* ui.pips: a stat drawn as a row of tokens. Themes restyle .pip / .pip.on (see kit/ui.js). */
  .pip-row { display: flex; align-items: center; gap: 4px; min-height: calc(var(--stat-size) * 1.1); }
  .pip { width: 9px; height: 9px; border-radius: 50%; border: 1.5px solid var(--dim); transition: background .15s, opacity .15s, transform .15s; }
  .pip.on { background: var(--ink); border-color: var(--ink); }
  #hud-layer { position: relative; flex: 1; min-height: 0; display: flex; flex-direction: column; align-items: center; gap: 8px; padding-top: 8px; }
  .progress { position: relative; width: 100%; height: 14px; border-radius: min(7px, var(--radius)); background: var(--panel); border: var(--border) solid var(--line); overflow: hidden; }
  .progress i { position: absolute; inset: 0 auto 0 0; width: 0; background: #6ea8ff; transition: width .18s ease-out; }
  .progress span { position: absolute; inset: 0; display: grid; place-items: center; font: 700 10px var(--display); letter-spacing: var(--label-spacing); text-transform: var(--label-case); }
  .toast {
    position: absolute; top: 22%; font: 700 30px var(--display); letter-spacing: .04em; text-align: center;
    text-shadow: 0 3px 0 rgba(0,0,0,.5); animation: toast 1.3s ease-out forwards;
  }
  @keyframes toast { 0% { opacity: 0; transform: scale(.6); } 15% { opacity: 1; transform: scale(1.08); } 75% { opacity: 1; transform: scale(1); } 100% { opacity: 0; transform: translateY(-14px); } }
  .hint {
    position: absolute; bottom: 14%; padding: 8px 14px; border-radius: 999px; background: var(--panel); border: var(--border) solid var(--line);
    font-weight: 600; transition: opacity .4s; animation: bob 1.4s ease-in-out infinite;
   box-shadow: var(--shadow);
  }
  .hint.gone { opacity: 0; }
  @keyframes bob { 50% { transform: translateY(-5px); } }
  .checklist { align-self: flex-start; display: flex; flex-direction: column; gap: 2px; padding: 6px 12px; border-radius: min(var(--radius), 16px); background: var(--panel); border: var(--border) solid var(--line); font-size: 12px;  box-shadow: var(--shadow);
  }
  .checklist div { display: flex; gap: 6px; align-items: center; }
  .checklist i { width: 12px; height: 12px; border-radius: 3px; border: 1px solid var(--line); display: grid; place-items: center; font-style: normal; font-size: 10px; color: var(--accent); }
  .checklist .done span { color: var(--dim); text-decoration: line-through; }
  #actions { display: flex; gap: 8px; }
  #actions:empty { display: none; }
  .action {
    pointer-events: auto; flex: 1; min-width: 0; padding: 9px 6px; border-radius: var(--radius-lg); background: var(--panel);
    border: var(--border) solid var(--line); border-bottom-width: calc(var(--border) + 2px); display: flex; flex-direction: column; align-items: center; gap: 2px;
    backdrop-filter: blur(var(--blur)); transition: transform .08s;
   box-shadow: var(--shadow);
  }
  .action:active { transform: translateY(2px); }
  .action b { font: 700 14px var(--display); }
  .action span { font-size: 12px; color: var(--accent); font-variant-numeric: tabular-nums; }
  /* Unaffordable is readable but clearly quieter; the affordable ones carry the accent. */
  .action:disabled { opacity: .62; filter: saturate(.4); }
  .action:not(:disabled) { border-color: var(--accent); }
  #stick { position: fixed; left: -60px; top: -60px; width: 120px; height: 120px; border-radius: 50%; border: 2px solid var(--line); background: rgba(255,255,255,.04); pointer-events: none; }
  #stick i { position: absolute; left: 38px; top: 38px; width: 44px; height: 44px; border-radius: 50%; background: rgba(255,255,255,.28); }

  /* Modal */
  /* The host is a native <dialog> (kit/ui.js opens it with showModal): these first rules undo the browser's dialog box so the host stays a full-screen scrim. */
  #modal { width: auto; height: auto; max-width: none; max-height: none; margin: 0; border: 0; box-sizing: border-box; overflow: visible; }
  #modal::backdrop { background: none; }
  #modal:not([open]) { display: none; }
  #modal { position: fixed; inset: 0; display: grid; place-items: center; grid-template-rows: minmax(0, 1fr); background: var(--scrim); backdrop-filter: blur(3px); padding: 16px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .modal-card { width: min(380px, 100%); display: flex; flex-direction: column; gap: 10px; animation: pop .22s cubic-bezier(.2, 1.4, .4, 1); }
  @keyframes pop { from { opacity: 0; transform: scale(.9) translateY(10px); } }
  .modal-card h2 { margin: 0; font: 700 30px var(--display); text-wrap: balance; }
  .modal-card p { margin: 0; color: var(--dim); }
  .choice {
    --c: #6ea8ff; text-align: left; padding: 12px 14px; border-radius: var(--radius-lg); background: var(--panel);
    border: var(--border) solid var(--line); border-left: 5px solid var(--c); display: flex; flex-direction: column; gap: 3px;
   box-shadow: var(--shadow);
  }
  .choice:active { transform: scale(.98); }
  .choice-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .choice b { font: 700 18px var(--display); }
  .choice em { font-style: normal; font-size: 11px; letter-spacing: var(--label-spacing); text-transform: var(--label-case); color: var(--c); }
  .choice span { color: var(--dim); font-size: 14px; }
  .rows { display: flex; flex-direction: column; gap: 4px; padding: 10px 14px; border-radius: var(--radius-lg); background: var(--panel); border: var(--border) solid var(--line);  box-shadow: var(--shadow);
  }
  .rows div { display: flex; justify-content: space-between; }
  .rows span { color: var(--dim); }
  .rows b { font-family: var(--display); font-variant-numeric: tabular-nums; }
  .modal-card.sheet { max-height: 100%; width: min(440px, 100%); }
  /* ui.panel turns this into the kit's scroll pane (kit/ui/scroll.js), which owns the overflow rules. */
  .sheet-body { overflow-y: auto; min-height: 0; display: flex; flex-direction: column; gap: 8px; padding: 2px; }
  .modal-card:focus { outline: none; }
  .primary { padding: 14px; border-radius: var(--radius-lg); background: var(--accent); color: var(--accent-ink); font: 700 18px var(--display); border-bottom: 4px solid var(--accent-edge); }
  .primary:active { transform: translateY(2px); }

  /* Menu: one screen. The header and footer keep their size; the list between them is the kit's scroll pane
     (kit/ui/menu.js mounts it into #menu-body). Sized with 100% heights, never vh, so it sits inside the host's safe area. */
  #menu { justify-content: flex-start; gap: 12px; pointer-events: auto; background: linear-gradient(180deg, rgba(7,10,24,.35) 0%, rgba(7,10,24,.72) 30%, rgba(7,10,24,.94) 100%); }
  #menu header { flex: none; display: flex; flex-direction: column; gap: 4px; }
  #menu h1 { margin: 0; font: 700 clamp(30px, 9vw, 56px)/.92 var(--display); letter-spacing: -.01em; text-wrap: balance; }
  #menu h1 span { color: var(--accent); }
  #menu header p { margin: 0; color: var(--dim); max-width: 46ch; font-size: 13px; }
  /* overflow here is the fallback scroller for the shell-built cards when the component library did not load. */
  #menu-body { flex: 1 1 0; min-height: 0; display: flex; flex-direction: column; gap: 8px; overflow-y: auto; }
  #menu-body:has(.ui-scroll) { overflow: visible; }
  #cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(260px, 100%), 1fr)); gap: 8px; padding-block: 2px 14px; }
  /* Fallback card (kit/shell.js); the library's Card replaces it. */
  .card {
    --c: #6ea8ff; display: flex; align-items: center; gap: 12px; text-align: left; padding: 10px 12px; border-radius: 14px;
    background: var(--panel); border: 1px solid var(--line); min-width: 0;
  }
  .card i { flex: none; width: 42px; height: 42px; border-radius: 10px; display: grid; place-items: center; font: 700 22px var(--display); font-style: normal; background: var(--c); color: #0a0d1c; }
  .card div { display: flex; flex-direction: column; min-width: 0; }
  .card b { font: 700 18px var(--display); }
  .card span { color: var(--dim); font-size: 13px; }
  .card em { font-style: normal; font-size: 11px; color: var(--c); letter-spacing: .04em; }
  #menu footer { flex: none; display: flex; justify-content: space-between; align-items: center; gap: 12px; color: var(--dim); font-size: 12px; }
  #menu footer div { display: flex; gap: 16px; }
  #menu footer button { min-height: 44px; white-space: nowrap; text-decoration: underline; text-underline-offset: 3px; }
  /* A phone on its side has no height to spare: title and footer move beside the list. */
  @media (orientation: landscape) and (max-height: 520px) {
    #menu { display: grid; grid-template-columns: minmax(200px, 34%) minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) auto; column-gap: 20px; row-gap: 4px; }
    #menu header { align-self: end; }
    #menu-body { grid-column: 2; grid-row: 1 / span 2; }
    #menu footer { grid-column: 1; grid-row: 2; }
  }
  #crash { position: fixed; left: 16px; right: 16px; top: calc(env(safe-area-inset-top, 0px) + 12px); padding: 10px 14px; border-radius: 12px; background: #4a1220; border: 1px solid var(--hot); z-index: 5; }
  @media (prefers-reduced-motion: reduce) { .hint, .toast, .modal-card { animation: none; } }
  /* HUD text takes the theme's ink; layout regions follow the theme's layout choices (kit/theme.js). */
  #hud, #modal, #floaters { color: var(--ink); font-family: var(--body); }
  body[data-stats="top-center"] #stats { margin-inline: auto; justify-content: center; }
  body[data-stats="top-left"] #stats { margin-left: 0; margin-right: auto; justify-content: flex-start; }
  body[data-actions="bottom-right"] #actions { justify-content: flex-end; }
  body[data-actions="bottom-right"] .action { flex: 0 1 auto; min-width: 96px; }
</style>

<div id="flash"></div>
<div id="floaters"></div>
<div id="stick" hidden><i></i></div>

<div id="hud" class="safe" hidden>
  <div id="hud-top">
    <button id="back" class="chip" type="button" aria-label="Back to menu">&#8249;</button>
    <button id="restart" class="chip" type="button" aria-label="Restart">&#8635;</button>
    <span id="game-name"></span>
    <div id="stats"></div>
  </div>
  <div id="hud-layer"></div>
  <div id="actions"></div>
</div>

<div id="menu" class="safe">
  <header>
    <h1>Pocket Loop <span>Lab</span></h1>
    <p>Small games and a shared tabletop, all built on clikit. Play each for a minute and pick the one worth building out.</p>
  </header>
  <div id="menu-body"><div id="cards"></div></div>
  <footer><span>Touch, mouse or keyboard</span><div><button id="open-gallery" type="button">Components</button><button id="mute" type="button">Sound on</button></div></footer>
</div>

<dialog id="modal" hidden></dialog>
<div id="crash" hidden></div>
